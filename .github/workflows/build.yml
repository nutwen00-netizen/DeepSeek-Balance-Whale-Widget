name: Build NSIS installer

# 云端打包：在 GitHub 托管的 Windows 虚拟机上编译并产出 NSIS 安装包。
# 本地被 Smart App Control（应用程序控制策略）拦截了构建脚本，改用云端构建绕开它。
#
# 触发方式：
#   1. 手动：仓库页 Actions → 本工作流 → Run workflow。
#   2. 自动：向分支 `For–WinDesktop` 推送。
on:
  workflow_dispatch:
  push:
    branches:
      - "For–WinDesktop"

jobs:
  build:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 先跑单测：验证「余额币种分组」修复能编译通过、且挑中非零币种那条记录。
      - name: Run tests (verify balance-currency fix)
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DS-Desktop-Whale-2.0.0-x64-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
